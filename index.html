<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>栄養関連物品発注システム | シルクロード七福神</title>
  <meta name="description" content="特別養護老人ホーム シルクロード七福神の栄養関連物品発注管理システム" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans JP', 'Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #fax-print-area, #fax-print-area * { visibility: visible; }
      #fax-print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 12mm 15mm; background: #fff; font-size: 11pt; }
      .no-print { display: none !important; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    // ===== JST日時 =====
    const getNowJST = () => new Date().toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
    const getTodayJST = () => {
      const now = new Date();
      const m = now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric' }).replace('月', '');
      const d = now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', day: 'numeric' }).replace('日', '');
      return `${m}月${d}日`;
    };

    // ===== デフォルトデータ =====
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzBGq2YJLKiA5xBQh6eR26RmVmr32mgFVcSmdoq8ApclICp-dqPwxS4llehwvw20XIUSg/exec';
    const REAL_UNITS = ['2W','2E','3W','3E','4W','4E','5W','5E','その他'];
    const REAL_VENDORS = [
      { id: 1, name: 'アサヒ物産株式会社', fax: '099-245-6556', contact: '担当様' },
      { id: 2, name: '藤安醸造株式会社',   fax: '099-262-1357', contact: '担当様' },
      { id: 3, name: '有限会社 山口米店',   fax: '0995-43-1789', contact: '担当様' }
    ];
    const REAL_PRODUCTS = [
      { id: 101, name: 'ソフティアS',                       unit: '個', vendorId: 1, isToromi: true,  allowPersonal: true,  allowFacility: true  },
      { id: 102, name: 'つるりんこ Quickly (800g/袋)',       unit: '袋', vendorId: 1, isToromi: true,  allowPersonal: true,  allowFacility: true  },
      { id: 103, name: 'とろみ調整 つるりんこ (3g×50本/箱)', unit: '箱', vendorId: 1, isToromi: true,  allowPersonal: true,  allowFacility: true  },
      { id: 201, name: 'だしするが',                        unit: '個', vendorId: 1, isToromi: false, allowPersonal: false, allowFacility: true  },
      { id: 202, name: 'ふりかけ大袋',                      unit: '袋', vendorId: 1, isToromi: false, allowPersonal: true,  allowFacility: true  },
      { id: 203, name: 'イオンサポート桃',                   unit: '個', vendorId: 1, isToromi: false, allowPersonal: true,  allowFacility: true  },
      { id: 204, name: 'イオンサポートりんご',               unit: '個', vendorId: 1, isToromi: false, allowPersonal: true,  allowFacility: true  },
      { id: 301, name: '濃口醤油 1.8ℓ',                    unit: '本', vendorId: 2, isToromi: false, allowPersonal: false, allowFacility: true  },
      { id: 302, name: '薄口醤油 1.8ℓ',                    unit: '本', vendorId: 2, isToromi: false, allowPersonal: false, allowFacility: true  },
      { id: 303, name: 'すり味噌',                          unit: '個', vendorId: 2, isToromi: false, allowPersonal: false, allowFacility: true  },
      { id: 401, name: '無洗米・精米',                      unit: 'kg', vendorId: 3, isToromi: false, allowPersonal: false, allowFacility: true  }
    ];
    const INIT_UNIT_DATA = {};

    function App() {
      const [role, setRole] = useState('staff');
      const [settingStep, setSettingStep] = useState(1);
      const [currentUnit, setCurrentUnit] = useState('2W');
      const [selectedApprover, setSelectedApprover] = useState('野元 史彦');
      const [showFaxModal, setShowFaxModal] = useState(false);
      const [faxStatus, setFaxStatus] = useState('preview');
      const [selectedFaxVendorId, setSelectedFaxVendorId] = useState(1);
      const [toastMessage, setToastMessage] = useState(null);
      const toastTimerRef = useRef(null);
      const [expandedHistoryId, setExpandedHistoryId] = useState(null);

      const DEFAULT_SETTINGS = {
        nutritionists: ['野元 史彦', '管理栄養士2'],
        deadlineTime: '14:00',
        orderDaysList: { '月': true, '火': true, '水': true, '木': true, '金': true, '土': true, '日': false },
        units: REAL_UNITS,
        vendors: REAL_VENDORS,
        products: REAL_PRODUCTS
      };
      const [systemSettings, setSystemSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('NUTRITION_SYSTEM_SETTINGS');
          return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
        } catch { return DEFAULT_SETTINGS; }
      });

      const gasUrl = DEFAULT_GAS_URL;
      const [isSendingToSheet, setIsSendingToSheet] = useState(false);

      const [newNutritionist, setNewNutritionist] = useState('');
      const [newUnitName, setNewUnitName] = useState('');
      const [newVendor, setNewVendor] = useState({ name: '', fax: '', contact: '' });
      const [newProduct, setNewProduct] = useState({ name: '', unit: '個', vendorId: 1, isToromi: false, allowPersonal: true, allowFacility: true });

      const [unitData, setUnitData] = useState(INIT_UNIT_DATA);

      const [orderHistory, setOrderHistory] = useState(() => {
        try { return JSON.parse(localStorage.getItem('NUTRITION_ORDER_HISTORY') || '[]'); } catch { return []; }
      });

      // 履歴検索・フィルター用State
      const [historyUnitFilter, setHistoryUnitFilter] = useState('ALL');
      const [historySearchKeyword, setHistorySearchKeyword] = useState('');

      // 目立つ申請完了通知用State
      const [submissionSuccessInfo, setSubmissionSuccessInfo] = useState(null);

      const [isSettingsAuth, setIsSettingsAuth] = useState(false);
      const [settingsPasswordInput, setSettingsPasswordInput] = useState('');
      const [settingsAuthError, setSettingsAuthError] = useState('');

      // ===== 設定の自動保存（localStorage）=====
      useEffect(() => {
        try { localStorage.setItem('NUTRITION_SYSTEM_SETTINGS', JSON.stringify(systemSettings)); } catch {}
      }, [systemSettings]);

      // ===== トースト =====
      const showToast = (msg) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToastMessage(msg);
        toastTimerRef.current = setTimeout(() => setToastMessage(null), 4000);
      };

      // ===== Settings Auth =====
      const handleSettingsAuthSubmit = (e) => {
        if (e) e.preventDefault();
        if (settingsPasswordInput === 'eiyou0729') {
          setIsSettingsAuth(true); setSettingsAuthError('');
          showToast('🔓 設定画面のロックを解除しました');
        } else { setSettingsAuthError('パスワードが正しくありません'); }
      };

      // ===== GAS送信（隠しフォームPOSTによる二重送信完全防止仕様） =====
      const sendToGAS = async (items) => {
        if (!gasUrl) return;
        const payloadStr = JSON.stringify({ action: 'bulkSubmit', items });

        try {
          // 隠しiframe作成
          let iframe = document.getElementById('gas_hidden_iframe');
          if (!iframe) {
            iframe = document.createElement('iframe');
            iframe.id = 'gas_hidden_iframe';
            iframe.name = 'gas_hidden_iframe';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
          }

          // 隠しform作成してPOST送信
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = gasUrl;
          form.target = 'gas_hidden_iframe';

          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'payload';
          input.value = payloadStr;

          form.appendChild(input);
          document.body.appendChild(form);
          form.submit();
          document.body.removeChild(form);
        } catch (e) {
          console.error('GAS送信エラー:', e);
        }
      };

      // ===== カート操作 (お米5kg単位増減 & 誤入力防止ガード) =====
      const currentUnitState = unitData[currentUnit] || { cart: {}, memo: '', staffName: '', submittedAt: '' };

      const updateItemQty = (productId, field, delta) => {
        const product = systemSettings.products.find(pr => pr.id === productId);
        // お米(kg)の場合は5kg単位
        const isRiceOrKg = product && (product.unit === 'kg' || product.name.includes('米') || product.name.includes('こめ'));
        const step = isRiceOrKg ? (delta > 0 ? 5 : -5) : delta;

        setUnitData(prev => {
          const unitInfo = prev[currentUnit] || { cart: {}, memo: '', staffName: '' };
          const currentItem = unitInfo.cart[productId] || { facilityQty: 0, personalQty: 0, personalNames: '' };
          const nextQty = Math.max(0, currentItem[field] + step);
          const updatedItem = { ...currentItem, [field]: nextQty };
          const newCart = { ...unitInfo.cart };
          if (updatedItem.facilityQty === 0 && updatedItem.personalQty === 0) { delete newCart[productId]; }
          else { newCart[productId] = updatedItem; }
          return { ...prev, [currentUnit]: { ...unitInfo, cart: newCart } };
        });
      };

      // 前回の発注内容を呼び出す (コピー機能)
      const copyLastOrderForUnit = () => {
        const lastEntry = orderHistory.find(h => h.unit === currentUnit);
        if (!lastEntry || !lastEntry.items || lastEntry.items.length === 0) {
          showToast(`⚠️ ${currentUnit}ユニットの過去の発注履歴が見つかりません。`);
          return;
        }
        setUnitData(prev => {
          const unitInfo = prev[currentUnit] || { cart: {}, memo: '', staffName: '' };
          const newCart = { ...unitInfo.cart };
          lastEntry.items.forEach(it => {
            const p = systemSettings.products.find(pr => pr.name === it.productName);
            if (p) {
              const existing = newCart[p.id] || { facilityQty: 0, personalQty: 0, personalNames: '' };
              newCart[p.id] = {
                facilityQty: existing.facilityQty + (it.facilityQty || 0),
                personalQty: existing.personalQty + (it.personalQty || 0),
                personalNames: existing.personalNames || (it.note?.includes('(') ? it.note.split('(')[1]?.replace(')','') : '')
              };
            }
          });
          return { ...prev, [currentUnit]: { ...unitInfo, cart: newCart, staffName: unitInfo.staffName || lastEntry.staffName || '' } };
        });
        showToast(`📋 ${currentUnit}ユニットの前回の発注内容を呼び出しました！`);
      };

      const updatePersonalNames = (productId, text) => {
        setUnitData(prev => {
          const unitInfo = prev[currentUnit] || { cart: {}, memo: '', staffName: '' };
          const currentItem = unitInfo.cart[productId] || { facilityQty: 0, personalQty: 0, personalNames: '' };
          return { ...prev, [currentUnit]: { ...unitInfo, cart: { ...unitInfo.cart, [productId]: { ...currentItem, personalNames: text } } } };
        });
      };
      const updateUnitMemo = (text) => { setUnitData(prev => ({ ...prev, [currentUnit]: { ...(prev[currentUnit] || { cart: {}, staffName: '' }), memo: text } })); };
      const updateUnitStaffName = (text) => { setUnitData(prev => ({ ...prev, [currentUnit]: { ...(prev[currentUnit] || { cart: {}, memo: '' }), staffName: text } })); };

      // ===== 設定ハンドラー =====
      const handleAddNutritionist = () => { if (!newNutritionist) return; setSystemSettings(p => ({ ...p, nutritionists: [...p.nutritionists, newNutritionist] })); setNewNutritionist(''); showToast('管理栄養士様を追加しました！'); };
      const handleDeleteNutritionist = (idx) => { setSystemSettings(p => ({ ...p, nutritionists: p.nutritionists.filter((_, i) => i !== idx) })); showToast('管理栄養士様を削除しました。'); };
      const toggleDay = (day) => { setSystemSettings(p => ({ ...p, orderDaysList: { ...p.orderDaysList, [day]: !p.orderDaysList[day] } })); showToast(`${day}曜日の設定を変更しました。`); };
      const handleAddUnit = () => { if (!newUnitName) return; setSystemSettings(p => ({ ...p, units: [...p.units, newUnitName] })); setNewUnitName(''); showToast('ユニットを追加しました！'); };
      const handleDeleteUnit = (idx) => { setSystemSettings(p => ({ ...p, units: p.units.filter((_, i) => i !== idx) })); showToast('ユニットを削除しました。'); };
      const handleAddVendor = () => {
        if (!newVendor.name || !newVendor.fax) { alert('業者名とFAX番号を入力してください。'); return; }
        setSystemSettings(p => ({ ...p, vendors: [...p.vendors, { id: Date.now(), ...newVendor }] }));
        setNewVendor({ name: '', fax: '', contact: '' }); showToast('新しい発注先業者を追加しました！');
      };
      // ===== 管理栄養士による申請編集ヘルパー =====
      const updateUnitQtyByNutritionist = (unitKey, productId, field, delta) => {
        setUnitData(prev => {
          const unitInfo = prev[unitKey] || { cart: {}, memo: '', staffName: '' };
          const currentItem = unitInfo.cart[productId] || { facilityQty: 0, personalQty: 0, personalNames: '' };
          const nextQty = Math.max(0, currentItem[field] + delta);
          const updatedItem = { ...currentItem, [field]: nextQty };
          const newCart = { ...unitInfo.cart };
          if (updatedItem.facilityQty === 0 && updatedItem.personalQty === 0) { delete newCart[productId]; }
          else { newCart[productId] = updatedItem; }
          return { ...prev, [unitKey]: { ...unitInfo, cart: newCart } };
        });
        showToast('管理栄養士：申請数量を変更しました。');
      };

      const deleteUnitItemByNutritionist = (unitKey, productId) => {
        setUnitData(prev => {
          const unitInfo = prev[unitKey] || { cart: {}, memo: '', staffName: '' };
          const newCart = { ...unitInfo.cart };
          delete newCart[productId];
          return { ...prev, [unitKey]: { ...unitInfo, cart: newCart } };
        });
        showToast('管理栄養士：商品を申請リストから削除しました。');
      };

      const updateHistoryItemQty = (entryId, itemIdx, field, delta) => {
        const updatedHistory = orderHistory.map(entry => {
          if (entry.id !== entryId) return entry;
          const updatedItems = entry.items.map((it, idx) => {
            if (idx !== itemIdx) return it;
            const nextQty = Math.max(0, it[field] + delta);
            return { ...it, [field]: nextQty };
          }).filter(it => (it.facilityQty + it.personalQty) > 0);
          return { ...entry, items: updatedItems };
        });
        setOrderHistory(updatedHistory);
        try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(updatedHistory)); } catch {}
      // ===== 管理栄養士による個別の承認・完了処理 =====
      const approveSingleOrder = (entryId) => {
        const updatedHistory = orderHistory.map(entry => entry.id === entryId ? { ...entry, status: '承認済' } : entry);
        setOrderHistory(updatedHistory);
        try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(updatedHistory)); } catch {}
        showToast('✅ 申請を承認済みに変更し、履歴へ保存しました。');
      };

      const approveAllOrders = () => {
        if (confirm('本日届いているすべての発注申請を「承認済」にして履歴へ移動しますか？')) {
          // 未送信カートも承認済みに変更してクリア
          setUnitData(prev => {
            const next = { ...prev };
            Object.keys(next).forEach(k => {
              next[k] = { cart: {}, memo: '', staffName: '', submittedAt: '' };
            });
            return next;
          });
          const updatedHistory = orderHistory.map(entry => ({ ...entry, status: '承認済' }));
          setOrderHistory(updatedHistory);
          try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(updatedHistory)); } catch {}
          showToast('✅ すべての申請を承認済みに変更し、履歴へ移動しました！');
        }
      };

      // ===== FAX出力＆承認完了処理 =====
      const handlePrintAndApprove = () => {
        // カート内の未送信アイテムがあれば、それを承認済にして履歴へ移動
        const newHistoryEntries = [];
        setUnitData(prev => {
          const next = { ...prev };
          Object.entries(next).forEach(([uKey, uVal]) => {
            const items = Object.entries(uVal.cart || {}).filter(([_, it]) => (it.facilityQty + it.personalQty) > 0);
            if (items.length > 0) {
              const flatItems = [];
              let isFirst = true;
              items.forEach(([pId, item]) => {
                const p = systemSettings.products.find(pr => pr.id === parseInt(pId));
                if (!p) return;
                if (item.facilityQty > 0) {
                  flatItems.push({ time: getNowJST(), unit: uKey, staffName: uVal.staffName || '管理栄養士', productName: p.name, productUnit: p.unit, facilityQty: item.facilityQty, personalQty: 0, note: uKey, memo: isFirst ? uVal.memo : '' });
                  isFirst = false;
                }
                if (item.personalQty > 0) {
                  flatItems.push({ time: getNowJST(), unit: uKey, staffName: uVal.staffName || '管理栄養士', productName: p.name, productUnit: p.unit, facilityQty: 0, personalQty: item.personalQty, note: `${uKey} (${item.personalNames || '個人購入'})`, memo: isFirst ? uVal.memo : '' });
                  isFirst = false;
                }
              });
              newHistoryEntries.push({ id: Date.now() + Math.random(), submittedAt: getNowJST(), unit: uKey, staffName: uVal.staffName || '管理栄養士', memo: uVal.memo, items: flatItems, status: '承認済' });
              next[uKey] = { cart: {}, memo: '', staffName: '', submittedAt: '' };
            }
          });
          return next;
        });

        // 履歴の申請中エントリーをすべて承認済へ更新
        setOrderHistory(prev => {
          const updated = prev.map(entry => entry.status === '申請中' ? { ...entry, status: '承認済' } : entry);
          const combined = [...newHistoryEntries, ...updated];
          try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(combined)); } catch {}
          return combined;
        });

        window.print();
        showToast('✅ FAX出力を行いました。対象の発注を【承認済】にして履歴へ移動しました！');
      };
      const toggleProductPermission = (productId, field) => {
        setSystemSettings(p => ({ ...p, products: p.products.map(pr => pr.id === productId ? { ...pr, [field]: !pr[field] } : pr) }));
        showToast('購入区分の設定を更新しました。');
      };
      const handleDeleteProduct = (id) => { if (confirm('この商品をリストから削除しますか？')) { setSystemSettings(p => ({ ...p, products: p.products.filter(pr => pr.id !== id) })); showToast('商品を削除しました。'); } };
      const handleAddProduct = () => {
        if (!newProduct.name) { alert('商品名を入力してください。'); return; }
        const isToromi = newProduct.name.includes('とろみ') || newProduct.name.includes('トロミ') || newProduct.name.includes('ソフティア') || newProduct.isToromi;
        const created = { id: Date.now(), ...newProduct, isToromi };
        setSystemSettings(p => {
          let list = [...p.products];
          if (isToromi) list.unshift(created); else list.push(created);
          return { ...p, products: list };
        });
        setNewProduct({ name: '', unit: '個', vendorId: systemSettings.vendors[0]?.id || 1, isToromi: false, allowPersonal: true, allowFacility: true });
        showToast('新規商品を追加しました！');
      };

      // ===== 発注送信 =====
      const handleSubmitOrder = async () => {
        const cart = unitData[currentUnit]?.cart || {};
        const items = Object.entries(cart).filter(([_, it]) => it.facilityQty + it.personalQty > 0);
        if (items.length === 0) { showToast('⚠️ カートに商品がありません。'); return; }
        const staffName = unitData[currentUnit]?.staffName || '';
        const memo = unitData[currentUnit]?.memo || '';
        if (!staffName.trim()) { showToast('⚠️ 発注担当者名を入力してください。'); return; }
        const now = getNowJST();

        // 申し送りメモはスプレッドシートで見やすいよう1行目のみに記載
        const flatItems = [];
        let isFirstRow = true;
        items.forEach(([pId, item]) => {
          const p = systemSettings.products.find(pr => pr.id === parseInt(pId));
          if (!p) return;
          if (item.facilityQty > 0) {
            flatItems.push({
              time: now, unit: currentUnit, staffName, productName: p.name, productUnit: p.unit,
              facilityQty: item.facilityQty, personalQty: 0, note: currentUnit,
              memo: isFirstRow ? memo : ''
            });
            isFirstRow = false;
          }
          if (item.personalQty > 0) {
            flatItems.push({
              time: now, unit: currentUnit, staffName, productName: p.name, productUnit: p.unit,
              facilityQty: 0, personalQty: item.personalQty,
              note: `${currentUnit} (${item.personalNames || '個人購入'})`,
              memo: isFirstRow ? memo : ''
            });
            isFirstRow = false;
          }
        });

        const newEntry = { id: Date.now(), submittedAt: now, unit: currentUnit, staffName, memo, items: flatItems, status: '申請中' };
        const updated = [newEntry, ...orderHistory];
        setOrderHistory(updated);
        try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(updated)); } catch {}

        await sendToGAS(flatItems);

        // カートクリア
        setUnitData(prev => ({ ...prev, [currentUnit]: { cart: {}, memo: '', staffName: '', submittedAt: '' } }));

        // 目立つ全画面完了バナーを表示
        setSubmissionSuccessInfo({ unit: currentUnit, count: flatItems.length, staff: staffName });
        setTimeout(() => setSubmissionSuccessInfo(null), 5000);
      };

      // 締切時刻（14:00）超過チェック
      const isAfterDeadline = () => {
        const now = new Date();
        const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        return currentHM > (systemSettings.deadlineTime || '14:00');
      };

      // CSVエクスポート (Excel対応 BOM付きUTF-8)
      const exportHistoryToCSV = () => {
        if (orderHistory.length === 0) {
          showToast('⚠️ 発注履歴がありません。');
          return;
        }

        const headers = ['送信日時', 'ステータス', 'ユニット名', '発注担当者', '商品名', '施設分数量', '個人分数量', 'FAX印字備考', '申送りメモ'];
        const rows = [headers];

        orderHistory.forEach(entry => {
          (entry.items || []).forEach(item => {
            rows.push([
              `"${item.time || entry.submittedAt}"`,
              `"${entry.status || '承認済'}"`,
              `"${entry.unit}"`,
              `"${entry.staffName || ''}"`,
              `"${item.productName || ''}"`,
              item.facilityQty || 0,
              item.personalQty || 0,
              `"${item.note || ''}"`,
              `"${item.memo || ''}"`
            ]);
          });
        });

        const csvContent = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `栄養管理発注履歴_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('📥 発注履歴のCSVファイルをダウンロードしました！');
      };

      const handleClearHistory = () => {
        if (confirm('発注履歴をすべてクリアしますか？この操作は元に戻せません。')) {
          setOrderHistory([]); try { localStorage.removeItem('NUTRITION_ORDER_HISTORY'); } catch {}
          showToast('発注履歴をクリアしました。');
        }
      };

      // ===== 一括シート送信 =====
      const handleBulkSendToSheet = async () => {
        setIsSendingToSheet(true);
        const allFlatItems = [];
        Object.entries(unitData).forEach(([uKey, uVal]) => {
          Object.entries(uVal.cart || {}).forEach(([pId, item]) => {
            const p = systemSettings.products.find(pr => pr.id === parseInt(pId));
            if (p) {
              if (item.facilityQty > 0) allFlatItems.push({ time: uVal.submittedAt || getNowJST(), unit: uKey, staffName: uVal.staffName, productName: p.name, facilityQty: item.facilityQty, personalQty: 0, note: uKey, memo: uVal.memo });
              if (item.personalQty > 0) allFlatItems.push({ time: uVal.submittedAt || getNowJST(), unit: uKey, staffName: uVal.staffName, productName: p.name, facilityQty: 0, personalQty: item.personalQty, note: `${uKey} (${item.personalNames || '個人購入'})`, memo: uVal.memo });
            }
          });
        });
        orderHistory.forEach(entry => (entry.items || []).forEach(item => allFlatItems.push(item)));
        await sendToGAS(allFlatItems);
        showToast(`✅ 全${allFlatItems.length}件をGoogleスプレッドシートへ送信しました！`);
        setIsSendingToSheet(false);
      };

      // ===== FAX =====
      const getOrdersForVendor = (vendorId) => {
        const list = [];
        Object.entries(unitData).forEach(([uKey, uVal]) => {
          Object.entries(uVal.cart || {}).forEach(([pId, item]) => {
            const p = systemSettings.products.find(pr => pr.id === parseInt(pId));
            if (p && p.vendorId === vendorId) {
              if (item.facilityQty > 0) list.push({ name: p.name, qty: item.facilityQty, unit: p.unit, note: uKey, unitName: uKey });
              if (item.personalQty > 0) list.push({ name: p.name, qty: item.personalQty, unit: p.unit, note: `${uKey} (${item.personalNames || '個人購入'})`, unitName: uKey });
            }
          });
        });
        orderHistory.filter(h => h.status === '申請中').forEach(entry => {
          (entry.items || []).forEach(item => {
            const p = systemSettings.products.find(pr => pr.name === item.productName);
            if (p && p.vendorId === vendorId) {
              if (item.facilityQty > 0) list.push({ name: item.productName, qty: item.facilityQty, unit: p.unit, note: item.note || item.unit, unitName: item.unit });
              if (item.personalQty > 0) list.push({ name: item.productName, qty: item.personalQty, unit: p.unit, note: item.note || item.unit, unitName: item.unit });
            }
          });
        });
        return list;
      };

      const currentFaxVendor = systemSettings.vendors.find(v => v.id === selectedFaxVendorId) || systemSettings.vendors[0];
      const currentFaxOrders = getOrdersForVendor(selectedFaxVendorId);
      const totalFaxQuantity = currentFaxOrders.reduce((sum, ord) => sum + ord.qty, 0);
      const mainUnitLabel = currentFaxOrders.length > 0 ? currentFaxOrders[0].unit : '個';
      const showTotalRow = currentFaxVendor && (currentFaxVendor.name.includes('山口米店') || currentFaxVendor.name.includes('藤安醸造'));

      // ===== スプレッドシートビュー用データ =====
      const allFlatSheetRows = [];
      Object.entries(unitData).forEach(([uKey, uVal]) => {
        let isFirst = true;
        Object.entries(uVal.cart || {}).forEach(([pId, item]) => {
          const p = systemSettings.products.find(pr => pr.id === parseInt(pId));

            if (item.facilityQty > 0) {

              isFirst = false;
            }
            if (item.personalQty > 0) {
              allFlatSheetRows.push({ time: uVal.submittedAt || '(未送信)', unit: uKey, staff: uVal.staffName, productName: p.name, facilityQty: '0', personalQty: `${item.personalQty} ${p.unit}`, note: `${uKey} (${item.personalNames || '個人購入'})`, memo: isFirst ? uVal.memo : '' });
              isFirst = false;
            }
          }
        });
      });
      orderHistory.forEach(entry => {
        let isFirst = true;
        (entry.items || []).forEach(item => {
          allFlatSheetRows.push({ time: item.time, unit: item.unit, staff: item.staffName, productName: item.productName, facilityQty: item.facilityQty > 0 ? `${item.facilityQty} ${item.productUnit || ''}` : '0', personalQty: item.personalQty > 0 ? `${item.personalQty} ${item.productUnit || ''}` : '0', note: item.note, memo: isFirst ? item.memo : '' });
          isFirst = false;
        });

      const navTabs = [
        { key: 'staff',        label: '🏢 ユニット発注' },

                      return (

                              <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                <span>{product.name}</span>
                                {isRiceOrKg && <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded border border-emerald-300 font-bold">5kg単位</span>}

                          </div>
                          {item.personalQty > 0 && (

                              <label className="text-xs font-bold text-amber-800 block mb-1">個人購入者名（FAX備考欄に印字）</label>
                              <input type="text" value={item.personalNames} onChange={e => updatePersonalNames(product.id, e.target.value)}
                                placeholder="例：山田 太郎様" className="w-full p-2.5 text-xs rounded-xl border border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-500 bg-amber-50" />
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* サイドバー (右側: 5 - 幅をより広く設定) */}
                  <div className="lg:col-span-5">
                    <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-200 space-y-5 sticky top-24">
                      <h3 className="text-base font-bold text-slate-800 border-b pb-3 flex items-center justify-between">
                        <span>発注申請</span>
                        <span className="text-xs px-3 py-1 bg-sky-100 text-sky-800 rounded-full font-bold">{currentUnit} ユニット</span>

                              const p = systemSettings.products.find(pr => pr.id === parseInt(pId));

                                <li key={pId} className="text-xs text-slate-800 flex justify-between items-center py-1 border-b border-slate-200">
                                  <span className="font-medium truncate">{p.name}</span>
                                  <span className="font-bold ml-2 bg-white px-2 py-0.5 rounded border border-slate-300">{it.facilityQty + it.personalQty} {p.unit}</span>

                  {settingStep === 4 && (
                    <div className="bg-white rounded-2xl p-6 shadow-sm border space-y-6">
                      <h3 className="text-base font-bold text-slate-800 border-b pb-3">📦 商品・購入区分一覧</h3>
                      <div className="space-y-2">
                        {systemSettings.products.map(p => {
                          const vendor = systemSettings.vendors.find(v => v.id === p.vendorId);
                          return (
                            <div key={p.id} className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border">
                              <div className="flex-1">
                                <p className="text-sm font-bold text-slate-800">{p.name} <span className="text-xs text-slate-400 font-normal">({p.unit})</span></p>
                                <p className="text-xs text-slate-500">{vendor ? vendor.name : '未割当'}{p.isToromi ? ' | 🟢 とろみ剤' : ''}</p>
                              </div>
                              <div className="flex items-center gap-3">
                                <button onClick={() => toggleProductPermission(p.id, 'allowFacility')}
                                  className={`px-3 py-1 rounded-lg text-xs font-bold border ${p.allowFacility ? 'bg-sky-600 text-white border-sky-600' : 'bg-white text-slate-400 border-slate-300'}`}>
                                  施設購入{p.allowFacility ? ' ✓' : ' ✗'}
                                </button>
                                <button onClick={() => toggleProductPermission(p.id, 'allowPersonal')}
                                  className={`px-3 py-1 rounded-lg text-xs font-bold border ${p.allowPersonal ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-400 border-slate-300'}`}>
                                  個人購入{p.allowPersonal ? ' ✓' : ' ✗'}
                                </button>
                                <button onClick={() => handleDeleteProduct(p.id)} className="p-1.5 text-red-500 hover:bg-red-50 rounded-lg font-bold">🗑️</button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      <div className="bg-amber-50 rounded-xl p-4 border border-amber-200 space-y-3">
                        <h4 className="text-xs font-bold text-amber-800">新規商品を追加</h4>
                        <div className="grid grid-cols-2 gap-3">
                          <input type="text" value={newProduct.name} onChange={e => setNewProduct(p => ({...p, name: e.target.value}))} placeholder="商品名" className="p-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500" />
                          <div className="flex items-center gap-2">
                            <select value={newProduct.unit} onChange={e => setNewProduct(p => ({...p, unit: e.target.value}))} className="p-2.5 text-xs rounded-xl border border-slate-300 font-bold">
                              <option value="個">個</option><option value="袋">袋</option><option value="箱">箱</option><option value="本">本</option><option value="kg">kg</option><option value="ℓ">ℓ</option>
                            </select>
                            <select value={newProduct.vendorId} onChange={e => setNewProduct(p => ({...p, vendorId: parseInt(e.target.value)}))} className="flex-1 p-2.5 text-xs rounded-xl border border-slate-300 font-bold">
                              {systemSettings.vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                            </select>
                          </div>
                        </div>
                        <div className="flex items-center gap-4">
                          <label className="flex items-center gap-1.5 text-xs font-bold text-slate-700">
                            <input type="checkbox" checked={newProduct.allowFacility} onChange={e => setNewProduct(p => ({...p, allowFacility: e.target.checked}))} className="rounded" />
                            <span>施設購入可</span>
                          </label>
                          <label className="flex items-center gap-1.5 text-xs font-bold text-slate-700">
                            <input type="checkbox" checked={newProduct.allowPersonal} onChange={e => setNewProduct(p => ({...p, allowPersonal: e.target.checked}))} className="rounded" />
                            <span>個人購入可</span>
                          </label>
                        </div>
                        <button onClick={handleAddProduct} className="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-xl">＋ 商品を追加</button>
                      </div>
                    </div>
                  )}
                </div>
              )
            )}
          </main>

          {/* ===== FAX モーダル ===== */}
          {showFaxModal && (
            <div className="fixed inset-0 bg-slate-900 bg-opacity-70 flex items-center justify-center p-4 overflow-y-auto" style={{zIndex:50,top:'64px',backdropFilter:'blur(4px)'}}>
              <div className="bg-white rounded-3xl p-6 max-w-4xl w-full shadow-2xl space-y-4 my-8 border border-slate-200">
                <div className="flex items-center justify-between border-b pb-4 no-print">
                  <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <span>🖨️ FAX注文票 PDF出力プレビュー</span>
                  </h3>
                  <button onClick={() => setShowFaxModal(false)}
                    className="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-xl font-bold text-sm flex items-center gap-1 transition-all">
                    ✖ 閉じる
                  </button>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-2.5 rounded-2xl no-print">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-slate-600 px-1">送信先業者:</span>
                    {systemSettings.vendors.map(v => (
                      <button key={v.id} onClick={() => setSelectedFaxVendorId(v.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${selectedFaxVendorId === v.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 hover:bg-slate-200'}`}>{v.name}</button>
                    ))}
                  </div>
                  <div className="flex items-center gap-2">
                    <label className="text-xs font-bold text-slate-600">印字担当者:</label>
                    <select value={selectedApprover} onChange={e => setSelectedApprover(e.target.value)}
                      className="p-1.5 text-xs rounded-xl border border-slate-300 font-bold bg-white focus:outline-none">
                      {systemSettings.nutritionists.map(n => <option key={n} value={n}>{n}</option>)}
                      <option value="">(なし・印字しない)</option>
                    </select>
                  </div>
                </div>

                {faxStatus === 'preview' ? (
                  <div className="space-y-4">
                    <div className="bg-slate-200 p-6 rounded-2xl shadow-inner overflow-x-auto">
                      <div id="fax-print-area" className="max-w-xl mx-auto bg-white p-8 border border-slate-400 shadow-md text-slate-900 font-serif space-y-4" style={{fontSize:'12px'}}>
                        <div className="flex items-start justify-between">
                          <div style={{width:'33%'}}></div>
                          <h2 style={{fontSize:'22px',fontWeight:'bold',letterSpacing:'0.1em',textAlign:'center',borderBottom:'2px solid #0f172a',paddingBottom:'4px'}}>FAX 注文票</h2>
                          <p style={{textAlign:'right',fontFamily:'monospace',width:'33%',paddingTop:'8px',fontSize:'11px'}}>{getTodayJST()}</p>
                        </div>
                        <div className="space-y-1 pt-2">
                          <div style={{fontSize:'15px',fontWeight:'bold',borderBottom:'1px solid #0f172a',paddingBottom:'2px',display:'inline-block',paddingRight:'60px'}}>{currentFaxVendor ? currentFaxVendor.name : ''}　様</div>
                          <p style={{fontFamily:'monospace',fontSize:'11px',fontWeight:'bold',color:'#334155'}}>FAX：{currentFaxVendor ? currentFaxVendor.fax : ''}</p>
                        </div>
                        <div style={{fontSize:'11px'}} className="space-y-1 font-sans pt-1">
                          <p>いつもお世話になっております。　注文を宜しくお願いします。</p>
                          <p style={{fontWeight:'bold',borderLeft:'2px solid #1e293b',paddingLeft:'8px'}}>※個人購入分は納品書・請求書を分けて頂くようよろしくお願いします。</p>
                        </div>
                        <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #0f172a',textAlign:'left',fontSize:'11px',fontFamily:'sans-serif'}}>
                          <thead>
                            <tr style={{borderBottom:'1px solid #0f172a',background:'#f1f5f9',fontWeight:'bold'}}>
                              <th style={{border:'1px solid #0f172a',padding:'8px',width:'50%'}}>商品名</th>
                              <th style={{border:'1px solid #0f172a',padding:'8px',textAlign:'center',width:'16%'}}>数量</th>
                              <th style={{border:'1px solid #0f172a',padding:'8px',width:'33%'}}>備考 (納品先ユニット名)</th>
                            </tr>
                          </thead>
                          <tbody>
                            {currentFaxOrders.length === 0 ? (
                              <tr><td colSpan={3} style={{padding:'16px',textAlign:'center',color:'#94a3b8',border:'1px solid #e2e8f0'}}>本日の発注商品は登録されていません</td></tr>
                            ) : (
                              <>
                                {currentFaxOrders.map((ord, idx) => (
                                  <tr key={idx} style={{borderBottom:'1px solid #0f172a'}}>
                                    <td style={{border:'1px solid #0f172a',padding:'8px',fontWeight:'bold'}}>{ord.name}</td>
                                    <td style={{border:'1px solid #0f172a',padding:'8px',textAlign:'center',fontWeight:'bold'}}>{ord.qty} {ord.unit}</td>
                                    <td style={{border:'1px solid #0f172a',padding:'8px',fontWeight:'bold'}}>{ord.note}</td>
                                  </tr>
                                ))}
                                {showTotalRow && (
                                  <tr style={{background:'#f1f5f9',fontWeight:'900',borderTop:'2px solid #0f172a'}}>
                                    <td style={{border:'1px solid #0f172a',padding:'8px',textAlign:'right',fontWeight:'900'}}>合計発注数</td>
                                    <td style={{border:'1px solid #0f172a',padding:'8px',textAlign:'center',fontWeight:'900',fontSize:'14px'}}>{totalFaxQuantity} {mainUnitLabel}</td>
                                    <td style={{border:'1px solid #0f172a',padding:'8px',fontWeight:'900',color:'#475569'}}>全ユニット集計済</td>
                                  </tr>
                                )}
                              </>
                            )}
                          </tbody>
                        </table>
                        <div style={{paddingTop:'24px',textAlign:'right',lineHeight:'1.5',fontFamily:'sans-serif'}}>
                          <p style={{fontWeight:'bold',fontSize:'11px'}}>特別養護老人ホーム</p>
                          <p style={{fontWeight:'bold',fontSize:'13px'}}>　　　　　シルクロード七福神</p>
                          {selectedApprover ? (
                            <p style={{fontSize:'11px',fontWeight:'bold',color:'#065f46',paddingTop:'2px'}}>担当：{selectedApprover} (栄養士)</p>
                          ) : null}
                          <p style={{fontSize:'10px',color:'#475569'}}>〒890-0082 鹿児島県鹿児島市紫原5丁目13-18</p>
                          <p style={{fontSize:'10px',color:'#475569',fontFamily:'monospace'}}>TEL:099-256-2729 / FAX:099-256-3729</p>
                        </div>
                      </div>
                    </div>
                    <div className="flex items-center justify-between pt-2 no-print">
                      <span className="text-xs text-slate-500 font-bold">※備考欄にユニット名が自動印字されます</span>
                      <div className="flex items-center gap-3">
                        <button onClick={() => setShowFaxModal(false)}
                          className="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-sm rounded-xl transition-all">
                          ✖ 閉じる
                        </button>
                        <button onClick={handlePrintAndApprove}
                          className="px-6 py-2.5 text-white font-bold text-sm rounded-xl shadow-lg flex items-center gap-2 hover:opacity-90"
                          style={{background:'linear-gradient(90deg,#059669,#0d9488)'}}>
                          📄 PDF出力（印刷 &amp; 承認完了）
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="py-10 text-center space-y-4 no-print">
                    <div className="text-6xl">✅</div>
                    <h4 className="font-bold text-slate-800 text-lg">PDF出力が完了しました！</h4>
                    <p className="text-sm text-slate-500">印刷ダイアログで「PDFとして保存」を選択するか、そのまま印刷してください。</p>
                    <button onClick={() => setShowFaxModal(false)} className="px-8 py-3 bg-slate-900 text-white font-bold text-sm rounded-xl">✖ 閉じる</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 mt-auto text-center text-xs text-slate-400 no-print">
            栄養関連物品発注システム | 特別養護老人ホーム シルクロード七福神
          </footer>
        </div>
      );
    }

    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
