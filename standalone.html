<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>栄養関連物品発注システム | シルクロード七福神</title>
  <meta name="description" content="特別養護老人ホーム シルクロード七福神の栄養関連物品発注管理システム" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans JP', 'Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #fax-print-area, #fax-print-area * { visibility: visible; }
      #fax-print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 12mm 15mm; background: #fff; font-size: 11pt; }
      .no-print { display: none !important; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    // ===== JST日時 =====
    const getNowJST = () => new Date().toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
    const getTodayJST = () => {
      const now = new Date();
      const m = now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric' }).replace('月', '');
      const d = now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', day: 'numeric' }).replace('日', '');
      return `${m}月${d}日`;
    };

    // ===== デフォルトデータ (GAS未接続時フォールバック用) =====
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzBGq2YJLKiA5xBQh6eR26RmVmr32mgFVcSmdoq8ApclICp-dqPwxS4llehwvw20XIUSg/exec';
    
    const FALLBACK_UNITS = [
      { id: 1, name: '2W', sortOrder: 1, active: true },
      { id: 2, name: '2E', sortOrder: 2, active: true },
      { id: 3, name: '3W', sortOrder: 3, active: true },
      { id: 4, name: '3E', sortOrder: 4, active: true },
      { id: 5, name: '4W', sortOrder: 5, active: true },
      { id: 6, name: '4E', sortOrder: 6, active: true },
      { id: 7, name: '5W', sortOrder: 7, active: true },
      { id: 8, name: '5E', sortOrder: 8, active: true },
      { id: 9, name: 'その他', sortOrder: 9, active: true }
    ];

    const FALLBACK_VENDORS = [
      { id: 1, name: 'アサヒ物産株式会社', fax: '099-245-6556', contact: '担当様', faxFormat: 'A', email: '', active: true },
      { id: 2, name: '藤安醸造株式会社',   fax: '099-262-1357', contact: '担当様', faxFormat: 'B', email: '', active: true },
      { id: 3, name: '有限会社 山口米店',   fax: '0995-43-1789', contact: '担当様', faxFormat: 'B', email: '', active: true }
    ];

    const FALLBACK_PRODUCTS = [
      { id: 101, name: 'ソフティアS',                       spec: '500g/袋', unit: '個', vendorId: 1, isToromi: true,  allowPersonal: true,  allowFacility: true,  sortOrder: 1, active: true },
      { id: 102, name: 'つるりんこ Quickly (800g/袋)',       spec: '800g/袋', unit: '袋', vendorId: 1, isToromi: true,  allowPersonal: true,  allowFacility: true,  sortOrder: 2, active: true },
      { id: 103, name: 'とろみ調整 つるりんこ (3g×50本/箱)', spec: '3g×50本', unit: '箱', vendorId: 1, isToromi: true,  allowPersonal: true,  allowFacility: true,  sortOrder: 3, active: true },
      { id: 201, name: 'だしするが',                        spec: '1kg/個',  unit: '個', vendorId: 1, isToromi: false, allowPersonal: false, allowFacility: true,  sortOrder: 4, active: true },
      { id: 202, name: 'ふりかけ大袋',                      spec: '500g/袋', unit: '袋', vendorId: 1, isToromi: false, allowPersonal: true,  allowFacility: true,  sortOrder: 5, active: true },
      { id: 203, name: 'イオンサポート桃',                   spec: '1kg/箱',  unit: '個', vendorId: 1, isToromi: false, allowPersonal: true,  allowFacility: true,  sortOrder: 6, active: true },
      { id: 204, name: 'イオンサポートりんご',               spec: '1kg/箱',  unit: '個', vendorId: 1, isToromi: false, allowPersonal: true,  allowFacility: true,  sortOrder: 7, active: true },
      { id: 301, name: '濃口醤油 1.8ℓ',                    spec: '1.8L/本', unit: '本', vendorId: 2, isToromi: false, allowPersonal: false, allowFacility: true,  sortOrder: 8, active: true },
      { id: 302, name: '薄口醤油 1.8ℓ',                    spec: '1.8L/本', unit: '本', vendorId: 2, isToromi: false, allowPersonal: false, allowFacility: true,  sortOrder: 9, active: true },
      { id: 303, name: 'すり味噌',                          spec: '1kg/個',  unit: '個', vendorId: 2, isToromi: false, allowPersonal: false, allowFacility: true,  sortOrder: 10, active: true },
      { id: 401, name: '無洗米・精米',                      spec: '5kg/袋',  unit: 'kg', vendorId: 3, isToromi: false, allowPersonal: false, allowFacility: true,  sortOrder: 11, active: true }
    ];

    const FALLBACK_NUTRITIONISTS = [
      { id: 1, name: '野元 史彦', role: '管理者', active: true },
      { id: 2, name: '管理栄養士2', role: '一般', active: true }
    ];

    function App() {
      const [role, setRole] = useState('staff');
      const [settingStep, setSettingStep] = useState(1);
      const [currentUnit, setCurrentUnit] = useState('2W');
      const [selectedApprover, setSelectedApprover] = useState('野元 史彦');
      const [showFaxModal, setShowFaxModal] = useState(false);
      const [faxStatus, setFaxStatus] = useState('preview');
      const [selectedFaxVendorId, setSelectedFaxVendorId] = useState(1);
      const [toastMessage, setToastMessage] = useState(null);
      const toastTimerRef = useRef(null);
      const [expandedHistoryId, setExpandedHistoryId] = useState(null);

      // GAS Web App URL
      const [gasUrl, setGasUrl] = useState(() => {
        return localStorage.getItem('NUTRITION_GAS_URL') || DEFAULT_GAS_URL;
      });

      // システム通信状態
      const [isLoading, setIsLoading] = useState(true);
      const [isNetworkError, setIsNetworkError] = useState(false);
      const [isSendingToSheet, setIsSendingToSheet] = useState(false);

      // スプレッドシートマスターState (Single Source of Truth)
      const [masterProducts, setMasterProducts] = useState(FALLBACK_PRODUCTS);
      const [masterVendors, setMasterVendors] = useState(FALLBACK_VENDORS);
      const [masterUnits, setMasterUnits] = useState(FALLBACK_UNITS);
      const [masterNutritionists, setMasterNutritionists] = useState(FALLBACK_NUTRITIONISTS);

      const [systemSettings, setSystemSettings] = useState({
        deadlineTime: '14:00',
        orderDaysList: { '月': true, '火': true, '水': true, '木': true, '金': true, '土': true, '日': false }
      });

      const [unitData, setUnitData] = useState({});
      const [orderHistory, setOrderHistory] = useState([]);

      // 編集用モーダルState (マスター管理)
      const [editingMasterItem, setEditingMasterItem] = useState(null);
      const [editingMasterType, setEditingMasterType] = useState(null);

      // マスター追加用Form State
      const [newProduct, setNewProduct] = useState({ name: '', spec: '', unit: '個', vendorId: 1, isToromi: false, allowPersonal: true, allowFacility: true });
      const [newVendor, setNewVendor] = useState({ name: '', fax: '', contact: '担当様', faxFormat: 'A', email: '' });
      const [newUnitName, setNewUnitName] = useState('');
      const [newNutritionist, setNewNutritionist] = useState('');

      // 履歴フィルター
      const [historyUnitFilter, setHistoryUnitFilter] = useState('ALL');
      const [historySearchKeyword, setHistorySearchKeyword] = useState('');
      const [submissionSuccessInfo, setSubmissionSuccessInfo] = useState(null);

      // 設定画面パスワード認証
      const [isSettingsAuth, setIsSettingsAuth] = useState(false);
      const [settingsPasswordInput, setSettingsPasswordInput] = useState('');
      const [settingsAuthError, setSettingsAuthError] = useState('');

      // ===== GASから全マスター & 履歴の一括取得 (JSONP & fallback) =====
      const fetchInitialData = useCallback(async () => {
        setIsLoading(true);
        setIsNetworkError(false);

        if (!gasUrl) {
          setIsLoading(false);
          return;
        }

        try {
          // JSONPまたはfetchによるデータ取得
          const callbackName = 'gas_callback_' + Date.now();
          const script = document.createElement('script');

          const timeoutTimer = setTimeout(() => {
            console.warn('GAS通信タイムアウト: ローカルデータで稼働します');
            setIsNetworkError(true);
            setIsLoading(false);
            if (document.body.contains(script)) document.body.removeChild(script);
          }, 8000);

          window[callbackName] = (data) => {
            clearTimeout(timeoutTimer);
            if (data && data.success) {
              if (data.products && data.products.length > 0) setMasterProducts(data.products);
              if (data.vendors && data.vendors.length > 0) setMasterVendors(data.vendors);
              if (data.units && data.units.length > 0) setMasterUnits(data.units);
              if (data.nutritionists && data.nutritionists.length > 0) setMasterNutritionists(data.nutritionists);
              if (data.settings) setSystemSettings(prev => ({ ...prev, ...data.settings }));
              if (data.orderHistory) {
                setOrderHistory(data.orderHistory);
                try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(data.orderHistory)); } catch {}
              }
              setIsNetworkError(false);
            }
            setIsLoading(false);
            delete window[callbackName];
            if (document.body.contains(script)) document.body.removeChild(script);
          };

          const separator = gasUrl.includes('?') ? '&' : '?';
          script.src = `${gasUrl}${separator}action=getInitialData&callback=${callbackName}&t=${Date.now()}`;
          script.onerror = () => {
            clearTimeout(timeoutTimer);
            setIsNetworkError(true);
            setIsLoading(false);
          };
          document.body.appendChild(script);
        } catch (e) {
          console.error('GAS通信失敗:', e);
          setIsNetworkError(true);
          setIsLoading(false);
        }
      }, [gasUrl]);

      useEffect(() => {
        fetchInitialData();
      }, [fetchInitialData]);

      // ===== トースト表示 =====
      const showToast = (msg) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToastMessage(msg);
        toastTimerRef.current = setTimeout(() => setToastMessage(null), 4000);
      };

      // ===== 設定認証 =====
      const handleSettingsAuthSubmit = (e) => {
        if (e) e.preventDefault();
        if (settingsPasswordInput === 'eiyou0729') {
          setIsSettingsAuth(true); setSettingsAuthError('');
          showToast('🔓 設定画面のロックを解除しました');
        } else { setSettingsAuthError('パスワードが正しくありません'); }
      };

      // ===== GAS POST送信ヘッダー (隠しForm経由) =====
      const postToGAS = (payloadObj) => {
        if (!gasUrl) return Promise.resolve(false);
        return new Promise((resolve) => {
          try {
            let iframe = document.getElementById('gas_hidden_iframe');
            if (!iframe) {
              iframe = document.createElement('iframe');
              iframe.id = 'gas_hidden_iframe';
              iframe.name = 'gas_hidden_iframe';
              iframe.style.display = 'none';
              document.body.appendChild(iframe);
            }

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = gasUrl;
            form.target = 'gas_hidden_iframe';

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'payload';
            input.value = JSON.stringify(payloadObj);

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
            resolve(true);
          } catch (e) {
            console.error('POST送信エラー:', e);
            resolve(false);
          }
        });
      };

      // ===== カート操作 (お米5kg増減 & 数量ガード) =====
      const currentUnitState = unitData[currentUnit] || { cart: {}, memo: '', staffName: '', submittedAt: '' };

      const updateItemQty = (productId, field, delta) => {
        const product = masterProducts.find(pr => pr.id === productId);
        const isRiceOrKg = product && (product.unit === 'kg' || product.name.includes('米') || product.name.includes('こめ'));
        const step = isRiceOrKg ? (delta > 0 ? 5 : -5) : delta;

        setUnitData(prev => {
          const unitInfo = prev[currentUnit] || { cart: {}, memo: '', staffName: '' };
          const currentItem = unitInfo.cart[productId] || { facilityQty: 0, personalQty: 0, personalNames: '' };
          const nextQty = Math.max(0, currentItem[field] + step);
          const updatedItem = { ...currentItem, [field]: nextQty };
          const newCart = { ...unitInfo.cart };
          if (updatedItem.facilityQty === 0 && updatedItem.personalQty === 0) { delete newCart[productId]; }
          else { newCart[productId] = updatedItem; }
          return { ...prev, [currentUnit]: { ...unitInfo, cart: newCart } };
        });
      };

      // 前回の発注内容を呼び出す
      const copyLastOrderForUnit = () => {
        const lastEntry = orderHistory.find(h => h.unit === currentUnit);
        if (!lastEntry || !lastEntry.items || lastEntry.items.length === 0) {
          showToast(`⚠️ ${currentUnit}ユニットの過去の発注履歴が見つかりません。`);
          return;
        }
        setUnitData(prev => {
          const unitInfo = prev[currentUnit] || { cart: {}, memo: '', staffName: '' };
          const newCart = { ...unitInfo.cart };
          lastEntry.items.forEach(it => {
            const p = masterProducts.find(pr => pr.name === it.productName || pr.id === it.productId);
            if (p) {
              const existing = newCart[p.id] || { facilityQty: 0, personalQty: 0, personalNames: '' };
              newCart[p.id] = {
                facilityQty: existing.facilityQty + (it.facilityQty || 0),
                personalQty: existing.personalQty + (it.personalQty || 0),
                personalNames: existing.personalNames || it.personalNames || ''
              };
            }
          });
          return { ...prev, [currentUnit]: { ...unitInfo, cart: newCart, staffName: unitInfo.staffName || lastEntry.staffName || '' } };
        });
        showToast(`📋 ${currentUnit}ユニットの前回の発注内容を呼び出しました！`);
      };

      const updatePersonalNames = (productId, text) => {
        setUnitData(prev => {
          const unitInfo = prev[currentUnit] || { cart: {}, memo: '', staffName: '' };
          const currentItem = unitInfo.cart[productId] || { facilityQty: 0, personalQty: 0, personalNames: '' };
          return { ...prev, [currentUnit]: { ...unitInfo, cart: { ...unitInfo.cart, [productId]: { ...currentItem, personalNames: text } } } };
        });
      };
      const updateUnitMemo = (text) => { setUnitData(prev => ({ ...prev, [currentUnit]: { ...(prev[currentUnit] || { cart: {}, staffName: '' }), memo: text } })); };
      const updateUnitStaffName = (text) => { setUnitData(prev => ({ ...prev, [currentUnit]: { ...(prev[currentUnit] || { cart: {}, memo: '' }), staffName: text } })); };

      // ===== 発注送信 (スプレッドシート正本登録) =====
      const handleSubmitOrder = async () => {
        const cart = unitData[currentUnit]?.cart || {};
        const items = Object.entries(cart).filter(([_, it]) => it.facilityQty + it.personalQty > 0);
        if (items.length === 0) { showToast('⚠️ カートに商品がありません。'); return; }
        const staffName = unitData[currentUnit]?.staffName || '';
        const memo = unitData[currentUnit]?.memo || '';
        if (!staffName.trim()) { showToast('⚠️ 発注担当者名を入力してください。'); return; }
        const now = getNowJST();

        const flatItems = [];
        const orderId = 'ORD-' + Date.now();
        const requestId = 'REQ-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
        const currentUnitObj = masterUnits.find(u => u.name === currentUnit);

        items.forEach(([pId, item]) => {
          const p = masterProducts.find(pr => pr.id === parseInt(pId));
          if (!p) return;
          const v = masterVendors.find(ven => ven.id === p.vendorId);

          flatItems.push({
            orderId,
            time: now,
            unitId: currentUnitObj?.id || 0,
            unit: currentUnit,
            staffName,
            productId: p.id,
            productName: p.name,
            spec: p.spec || '',
            productUnit: p.unit || '個',
            vendorId: p.vendorId,
            vendorName: v?.name || '',
            facilityQty: item.facilityQty || 0,
            personalQty: item.personalQty || 0,
            personalNames: item.personalNames || '',
            note: item.personalQty > 0 ? `${currentUnit} (${item.personalNames || '個人購入'})` : currentUnit,
            memo
          });
        });

        const newEntry = {
          id: orderId,
          submittedAt: now,
          unitId: currentUnitObj?.id || 0,
          unit: currentUnit,
          staffName,
          memo,
          items: flatItems,
          status: '申請中'
        };

        const updatedHistory = [newEntry, ...orderHistory];
        setOrderHistory(updatedHistory);
        try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(updatedHistory)); } catch {}

        // GAS POST送信
        await postToGAS({ action: 'bulkSubmit', items: flatItems, orderId, requestId });

        // カートクリア
        setUnitData(prev => ({ ...prev, [currentUnit]: { cart: {}, memo: '', staffName: '', submittedAt: '' } }));

        setSubmissionSuccessInfo({ unit: currentUnit, count: flatItems.length, staff: staffName });
        setTimeout(() => setSubmissionSuccessInfo(null), 5000);
      };

      // ===== ステータス更新ヘルパー (承認 / FAX送信済) =====
      const updateOrderStatusInGAS = async (orderId, newStatus, senderName) => {
        const updated = orderHistory.map(entry => {
          if (entry.id === orderId || orderId === 'ALL_PENDING') {
            return {
              ...entry,
              status: newStatus,
              approver: senderName,
              approvedAt: getNowJST(),
              ...(newStatus === 'FAX送信済' ? { faxSentAt: getNowJST(), faxSender: senderName } : {})
            };
          }
          return entry;
        });
        setOrderHistory(updated);
        try { localStorage.setItem('NUTRITION_ORDER_HISTORY', JSON.stringify(updated)); } catch {}

        await postToGAS({ action: 'updateOrderStatus', orderId, status: newStatus, sender: senderName });
      };

      // FAX印刷＆自動承認
      const handlePrintAndApprove = () => {
        updateOrderStatusInGAS('ALL_PENDING', '承認済', selectedApprover);
        window.print();
        showToast('✅ FAX出力を行いました。対象の発注を【承認済】にして履歴へ保存しました！');
      };

      // 単独承認
      const approveSingleOrder = (entryId) => {
        updateOrderStatusInGAS(entryId, '承認済', selectedApprover);
        showToast('✅ 発注を承認済みに変更しました。');
      };

      // 全一括承認
      const approveAllOrders = () => {
        if (confirm('本日届いているすべての発注申請を「承認済」にして履歴へ移動しますか？')) {
          updateOrderStatusInGAS('ALL_PENDING', '承認済', selectedApprover);
          showToast('✅ すべての申請を承認済みに変更し、履歴へ移動しました！');
        }
      };

      // FAX送信済みに変更
      const markFaxSent = (vendorId) => {
        updateOrderStatusInGAS('ALL_PENDING', 'FAX送信済', selectedApprover);
        showToast('📠 FAX送信済みに変更し、送信履歴を保存しました！');
      };

      // ===== マスター操作 (CRUD & 有効無効切り替え) =====
      const saveMasterItem = async (masterType, item) => {
        let updatedList = [];
        if (masterType === 'product') {
          const isNew = !item.id;
          const itemId = isNew ? Date.now() : item.id;
          const updatedItem = { ...item, id: itemId, active: item.active !== false };
          updatedList = isNew ? [...masterProducts, updatedItem] : masterProducts.map(p => p.id === itemId ? updatedItem : p);
          setMasterProducts(updatedList);
        } else if (masterType === 'vendor') {
          const isNew = !item.id;
          const itemId = isNew ? Date.now() : item.id;
          const updatedItem = { ...item, id: itemId, active: item.active !== false };
          updatedList = isNew ? [...masterVendors, updatedItem] : masterVendors.map(v => v.id === itemId ? updatedItem : v);
          setMasterVendors(updatedList);
        } else if (masterType === 'unit') {
          const isNew = !item.id;
          const itemId = isNew ? Date.now() : item.id;
          const updatedItem = { ...item, id: itemId, active: item.active !== false };
          updatedList = isNew ? [...masterUnits, updatedItem] : masterUnits.map(u => u.id === itemId ? updatedItem : u);
          setMasterUnits(updatedList);
        } else if (masterType === 'nutritionist') {
          const isNew = !item.id;
          const itemId = isNew ? Date.now() : item.id;
          const updatedItem = { ...item, id: itemId, active: item.active !== false };
          updatedList = isNew ? [...masterNutritionists, updatedItem] : masterNutritionists.map(n => n.id === itemId ? updatedItem : n);
          setMasterNutritionists(updatedList);
        }

        await postToGAS({ action: 'updateMaster', masterType, item });
        showToast(`マスター情報【${item.name}】を更新しました！`);
        setEditingMasterItem(null);
      };

      const toggleMasterActive = async (masterType, item) => {
        const nextActive = !item.active;
        await saveMasterItem(masterType, { ...item, active: nextActive });
        showToast(`【${item.name}】を${nextActive ? '有効化' : '無効化'}しました。`);
      };

      // 締切チェック
      const isAfterDeadline = () => {
        const now = new Date();
        const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        return currentHM > (systemSettings.deadlineTime || '14:00');
      };

      // CSVエクスポート
      const exportHistoryToCSV = () => {
        if (orderHistory.length === 0) {
          showToast('⚠️ 発注履歴がありません。');
          return;
        }

        const headers = ['発注ID', '送信日時', 'ステータス', 'ユニット名', '発注担当者', '商品名', '規格', '単位', '業者名', '施設分数量', '個人分数量', 'FAX印字備考', '申送りメモ', '承認者', 'FAX送信日時'];
        const rows = [headers];

        orderHistory.forEach(entry => {
          (entry.items || []).forEach(item => {
            rows.push([
              `"${entry.id}"`,
              `"${item.time || entry.submittedAt}"`,
              `"${entry.status || '承認済'}"`,

          {showFaxModal && (
            <div className="fixed inset-0 bg-slate-900 bg-opacity-70 flex items-center justify-center p-4 no-print" style={{zIndex:9000,backdropFilter:'blur(4px)'}}>
              <div className="bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="font-bold text-sm">📠 FAX注文票 印刷プレビューモーダル</span>
                    <select value={selectedFaxVendorId} onChange={e => setSelectedFaxVendorId(Number(e.target.value))}
                      className="p-1.5 text-xs font-bold rounded-lg bg-slate-800 text-white border border-slate-700">
                      {masterVendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                    </select>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={handlePrintAndApprove} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow flex items-center gap-1.5">
                      📄 PDF出力 (印刷) ＆ 承認クリア
                    </button>
                    <button onClick={() => markFaxSent(selectedFaxVendorId)} className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-xl shadow">
                      📠 FAX送信済みに変更
                    </button>
                    <button onClick={() => setShowFaxModal(false)} className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs rounded-xl">
                      ✕ 閉じる
                    </button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-8 bg-slate-200">
                  <div id="fax-print-area" className="bg-white p-8 max-w-2xl mx-auto shadow-lg rounded-xl border border-slate-300 font-sans">
                    <div className="text-right text-xs text-slate-500 mb-2">送信日時: {getNowJST()}</div>
                    <div className="border-b-2 border-slate-900 pb-3 flex justify-between items-end mb-6">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900">{currentFaxVendor.name} 御中</h2>
                        <p className="text-xs text-slate-600 mt-1">FAX番号: <span className="font-bold font-mono text-sm">{currentFaxVendor.fax}</span>（ご担当: {currentFaxVendor.contact}）</p>
                      </div>
                      <div className="text-right">
                        <h1 className="text-lg font-bold tracking-widest text-slate-900">発 注 書</h1>
                        <p className="text-xs text-slate-600">特別養護老人ホーム シルクロード七福神</p>
                      </div>
                    </div>

                    <p className="text-xs text-slate-700 mb-4">いつも大変お世話になっております。下記の通り物品を発注いたしますのでご手配のほどよろしくお願い申し上げます。</p>

                    <table className="w-full text-left text-xs border-collapse border border-slate-900 mb-6">
                      <thead>
                        <tr className="bg-slate-100 border-b border-slate-900 font-bold">
                          <th className="border border-slate-900 p-2 text-center w-12">No</th>
                          <th className="border border-slate-900 p-2">品名</th>
                          <th className="border border-slate-900 p-2 text-center w-20">数量</th>
                          <th className="border border-slate-900 p-2 text-center w-16">単位</th>
                          <th className="border border-slate-900 p-2">備考 (対象ユニット・個人名)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {currentFaxOrders.length === 0 ? (
                          <tr><td colSpan="5" className="p-4 text-center text-slate-400">現在、この業者への発注はありません</td></tr>
                        ) : (
                          currentFaxOrders.map((ord, idx) => (
                            <tr key={idx} className="border-b border-slate-400">
                              <td className="border border-slate-900 p-2 text-center font-mono">{idx + 1}</td>
                              <td className="border border-slate-900 p-2 font-bold text-slate-900">{ord.name}</td>
                              <td className="border border-slate-900 p-2 text-center font-bold text-slate-900 text-sm">{ord.qty}</td>
                              <td className="border border-slate-900 p-2 text-center">{ord.unit}</td>
                              <td className="border border-slate-900 p-2 font-medium text-slate-800">{ord.note}</td>
                            </tr>
                          ))
                        )}
                        {showTotalRow && currentFaxOrders.length > 0 && (
                          <tr className="bg-slate-100 font-bold border-t-2 border-slate-900">
                            <td colSpan="2" className="border border-slate-900 p-2 text-right">合計数量</td>
                            <td className="border border-slate-900 p-2 text-center text-sm text-slate-900">{totalFaxQuantity}</td>
                            <td className="border border-slate-900 p-2 text-center">{mainUnitLabel}</td>
                            <td className="border border-slate-900 p-2 text-xs text-slate-500">※上記全明細の総合計数量</td>
                          </tr>
                        )}
                      </tbody>
                    </table>

                    <div className="border border-slate-400 p-4 rounded text-xs space-y-1 bg-slate-50">
                      <p className="font-bold text-slate-800">【発注元情報】</p>
                      <p>特別養護老人ホーム シルクロード七福神（栄養管理室）</p>
                      <p>〒899-5431 鹿児島県姶良市西餅田3312</p>
                      <p>TEL: 0995-67-3311 / FAX: 0995-67-3322</p>
                      <p className="pt-1 font-bold text-slate-900">発注確認者: {selectedApprover} （管理栄養士）</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
